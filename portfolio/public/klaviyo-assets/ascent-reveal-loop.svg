 #ax-stage{transform-box:fill-box;transform-origin:50% 50%;animation:ax-stage 5.4s linear infinite}
 #ax-mark{transform-box:fill-box;transform-origin:50% 84%;animation:ax-breath 5.4s linear infinite}
 #ax-word{transform-box:fill-box;transform-origin:50% 50%;animation:ax-word 5.4s linear infinite}
 .ax-sweep{transform-box:fill-box;transform-origin:50% 100%;will-change:transform}
 #ax-sw-base{animation:ax-sw-base 5.4s linear infinite}
 #ax-sw-notch{animation:ax-sw-notch 5.4s linear infinite}
 #ax-sw-peak{animation:ax-sw-peak 5.4s linear infinite}
 .ax-l{transform-box:fill-box;transform-origin:50% 50%;will-change:transform,opacity}
 #ax-l0{animation:ax-l0 5.4s linear infinite}
 #ax-l1{animation:ax-l1 5.4s linear infinite}
 #ax-l2{animation:ax-l2 5.4s linear infinite}
 #ax-l3{animation:ax-l3 5.4s linear infinite}
 #ax-l4{animation:ax-l4 5.4s linear infinite}
 #ax-l5{animation:ax-l5 5.4s linear infinite}
 @media (prefers-reduced-motion:reduce){
  #ax-stage,#ax-mark,#ax-word,.ax-sweep,.ax-l{animation:none!important;transform:none!important;opacity:1!important}
  .ax-sweep{transform:scaleY(1)!important}
 }
</style>
